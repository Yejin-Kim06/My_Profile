baseURL: "https://yejin-kim06.github.io/My_Profile/"
languageCode: "en-us"
title: "My_Profile"
theme: hugo-profile

# Multilingual configuration
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false

languages:
  ko:
    languageName: 한국어
    weight: 1
    contentDir: "content"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: gallery
      #name: Gallery
      #title: Gallery
      #url: /gallery
      weight: 2
    #Dropdown menu
    # - identifier: dropdown
    #   title: Example dropdown menu
    #   name: Dropdown
    #   weight: 3
    # - identifier: dropdown1
    #   title: example dropdown 1
    #   name: example 1
    #   url: /#
    #   parent: dropdown
    #   weight: 1
    # - identifier: dropdown2
    #   title: example dropdown 2
    #   name: example 2
    #   url: /#
    #   parent: dropdown
    #   weight: 2

params:
  title: "Hugo Profile"
  description: Text about my cool site
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "My Profile" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "컴퓨터인공지능학부에 재학중인"
    title: "김예진입니다"
    subtitle: "자기 소개 사이트"
    content: "저의 관심 분야와 이력을 소개하겠습니다."
    image: /images/me.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: false
      name: "주소"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Yejin-Kim06
      customIcons:
        - icon: /images/email.png
          url: "mailto:202513490@jbnu.ac.kr"

  # About
  about:
    enable: true
    title: "자기소개"
    image: /images/me2.jpg
    content:
      저는 학창시절부터 프로그래밍에 관심을 가져왔습니다. 그래서, 컴퓨터인공지능학부에서 즐겁게 재학중입니다. 비록 생각보다 전공과목을 따라가기는 힘들지만, 최대한 노력중입니다. 아직 발아하지 않은 씨앗처럼 봐주시면 감사하겠습니다~😊


  # Experience
  experience:
    enable: true
    title: "나의 강점"
    items:
      - company: "창의성"
        jobs:
          - name: "항상 주변을 다른 시각으로 보려는 태도를 취합니다."
            content: 저는 평소에도 공상하는 것을 즐겨합니다. 또한 문제를 해결하는 방법을 다양한 방법을 이용하여 해결하려고 합니다.
           
 
      - company: "끈기"
        jobs:
          - name: "한 번 열정을 가지면 끝까지 갑니다."
            info:
              content: 한 번 맡은 일은 끝까지 물고 늘어지는 경향이 있습니다.
                      장기간 프로젝트를 하기 좋은 성격입니다.

      - company: "친절함"
        jobs:
        - name: "타인을 배려할 줄 압니다."
          content: |
            타인과 협업할 일이 많은 개발자의 특성상 성격이 좋다는 평판을 가진다는 것은
            팀플레이를 하는 입장에서 가장 큰 장점입니다.

  education:
    enable: true
    title: "관심 분야"
    index: false
    items:
      - title: "컴퓨터 그래픽스"
        school:
          name: "전공 과목 중에 제일 재미있어 보였습니다."
        content: |-
            - 고등학교 재학 중이였을 때, 3D 그래픽을 이용하는 프로그램에 참여한 뒤로 이 분야에 관심을 가지게 되었습니다.
            
            - 우연히 해당 전공 과목에 대한 OT를 듣게 됐는데, 평소 배우고 싶었던 것들을 배울 수 있을 것 같아서 더 관심이 생겼습니다.
      - title: "네트워크 보안"
        school:
          name: "최근에 관심이 생기기 시작했습니다."

        content: |-
          최근에 뉴스, 유튜브 등 많은 매체에서 해킹과 같은 보안 문제 사태를 접하게 되면서 자연스럽게
          보안과 관련된 분야에도 관심이 생겼습니다.


  # Achievements
  achievements:
    enable: true
    #title: 키워야 하는 역량
    items:
      - title: Google kickstart runner
        content: I solved all problems with optimal solution.
        url: https://example.com
        image: /images/achievement.jpg
      - title: Facebook Hackathon Winner
        content: Developed a product using Artificial Intelligence.
        image: /images/achievement.jpg
      - title: Hugo Profile
        content: Developed a theme and getting 1K+ downloads per month.
        url: "https://github.com/gurusabarish/hugo-profile"
        image: /images/achievement.jpg


  # projects
  projects:
    enable: true
    title: "활동 이력"
    items:
      - title: 2023 목포 고교 해커톤 대회 참가
        content: 2023년 3개의 고등학교와 연합하여 진행한 해커톤 대회에 참가하여 ESG경영에 대해 탐구하고 제설차를 구현했습니다. 처음으로 하는 대형 팀플레이 프로젝트라 뜻깊었습니다.
        image: /images/projects/car.jpg
        featured:
          name: 관련 링크
          link: https://naver.me/GUTefEJ8
        
      - title: live2d 아바타 제작 경험
        content: 그래픽스에 대한 관심으로 취미로 만든 경험이 있습니다. 물리엔진 넣는게 가장 어려웠습니다.
        image: /images/projects/live2d.png
        featured:
          name: 제작툴
          link: https://www.live2d.com/ko/

      - title: 지역 정보 센터 견학
        content: sk broadband 사옥에서 견학을 신청하여 설명을 들었습니다. 통신 장비를 직접 눈으로 보면서 인터넷 정보망이 어떻게 형성되어 있고, 구조는 어떤지에 대해 알 수 있었습니다.
        image: /images/projects/b1.jpg
        featured:
          name: 보고서 원문
          link: /images/projects/report.jpg

